name: Auto-Update Portfolio (Completely Automatic)

# Makes portfolio completely automatic:
# - Daily at 00:00 UTC, fetches all gaganjainse repos from GitHub API
# - Updates src/data/projects.ts with latest stars, description, tech, test estimates
# - Generates favicons, OG image, resume PDF
# - Runs type-check, lint, format check, unit tests, build
# - If projects.ts or public/ assets changed, commits and pushes to main
# - Vercel auto-deploys on push to main (already configured via vercel.json)
# - No manual editing needed — portfolio updates itself when you push new repo
#
# 2026-08-13: every `|| true`/`|| echo continuing` removed. A daily job that
# forgives its own core step is how the OG image silently never regenerated
# (fonts missing for an unknown time). Failures now fail the run — the next
# schedule retries, and the failure is visible in Actions.

on:
  schedule:
    - cron: '0 0 * * *' # daily midnight UTC
  workflow_dispatch: # manual trigger from GitHub UI (useful on mobile)
  push:
    branches: [main]
    paths-ignore:
      - 'src/data/projects.ts' # avoid loop when auto-update commits
      - 'public/projects.json'
      - 'public/resume.pdf'
      - 'public/favicon.ico'
      - 'public/og-image.png'

permissions:
  contents: write # push the auto-update branch
  pull-requests: write # open + auto-merge the PR

jobs:
  auto-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history; the push back needs it

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Python for generators
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install Python deps for favicons/OG
        run: pip install pillow -q

      - name: Install Node deps
        run: npm ci --legacy-peer-deps

      - name: Update projects from GitHub API (auto)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching all repos for gaganjainse..."
          npm run update:projects

      - name: Normalize generated data formatting (prettier)
        run: |
          # update:projects writes src/data/projects.ts + public/projects.json
          # non-prettier-formatted → format:check would fail on the regenerated
          # files. Normalize immediately so the gates stay green.
          npx prettier --write src/data/projects.ts public/projects.json

      - name: Generate all assets (favicons + OG image + resume PDF) — automatic
        run: npm run generate:all

      - name: Type-check, lint, format check, tests, build — automatic gates
        run: |
          npm run check
          npm run lint
          npm run format:check
          npm test
          npm run build

      - name: Commit and open PR if changed (automatic)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "portfolio-bot[bot]"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add src/data/projects.ts public/projects.json public/resume.pdf public/favicon.ico public/og-image.png public/apple-touch-icon.png public/favicon-*.png
          git add src/data/ public/
          if git diff --cached --quiet; then
            echo "No changes to commit — portfolio already up-to-date"
            exit 0
          fi
          echo "Changes detected, committing..."
          git diff --cached --stat
          git commit -m "chore: auto-update portfolio — projects from GitHub API + favicons + OG + resume PDF — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # main requires PRs (ruleset): push a branch, open a PR, auto-merge.
          BRANCH="auto-update/$(date -u +%Y%m%d-%H%M%S)"
          git push origin "HEAD:$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: auto-update portfolio — $(date -u +%Y-%m-%d)" \
            --body "Auto-generated by the portfolio auto-update workflow."
          gh pr merge --auto --squash "$BRANCH"

      - name: Summary
        run: |
          {
            echo "### Portfolio Auto-Update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Fetched all repos via GitHub API (auto)"
            echo "- Updated src/data/projects.ts with latest stars/description/tech"
            echo "- Generated favicons, OG image, resume PDF (auto)"
            echo "- Ran type-check, lint, format, tests, build (gates)"
            echo "- Pushed if changed — Vercel auto-deploys"
            echo "- Completely automatic — no manual editing needed"
          } >> "$GITHUB_STEP_SUMMARY"
