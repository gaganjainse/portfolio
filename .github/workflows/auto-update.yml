name: Auto-Update Portfolio (Completely Automatic)

# Makes portfolio completely automatic:
# - Daily at 00:00 UTC, fetches all gaganjainse repos from GitHub API
# - Updates src/data/projects.ts with latest stars, description, tech, test estimates
# - Generates favicons, OG image, resume PDF
# - Runs type-check, lint, format check, unit tests, build
# - If projects.ts or public/ assets changed, commits and pushes to main
# - Vercel auto-deploys on push to main (already configured via vercel.json)
# - No manual editing needed — portfolio updates itself when you push new repo

on:
  schedule:
    - cron: "0 0 * * *" # daily midnight UTC
  workflow_dispatch: # manual trigger from GitHub UI (useful on mobile)
  push:
    branches: [main]
    paths-ignore:
      - "src/data/projects.ts" # avoid loop when auto-update commits
      - "public/projects.json"
      - "public/resume.pdf"
      - "public/favicon.ico"
      - "public/og-image.png"

permissions:
  contents: write

jobs:
  auto-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python for generators
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps for favicons/OG
        run: pip install pillow -q

      - name: Install Node deps
        run: npm ci

      - name: Update projects from GitHub API (auto)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching all repos for gaganjainse..."
          npm run update:projects || echo "update:projects failed, continuing with existing data"

      - name: Generate all assets (favicons + OG image + resume PDF) — automatic
        run: |
          npm run generate:all || echo "generate:all had warnings, continuing"

      - name: Type-check, lint, format check, tests, build — automatic gates
        run: |
          npm run check
          npm run lint
          npm run format:check
          npm test
          npm run build

      - name: Commit and push if changed (automatic)
        run: |
          git config user.name "portfolio-bot[bot]"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add src/data/projects.ts public/projects.json public/resume.pdf public/favicon.ico public/og-image.png public/apple-touch-icon.png public/favicon-*.png 2>/dev/null || true
          git add src/data/ public/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit — portfolio already up-to-date"
            exit 0
          fi
          echo "Changes detected, committing..."
          git diff --cached --stat
          git commit -m "chore: auto-update portfolio — projects from GitHub API + favicons + OG + resume PDF [skip ci] — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin main

      - name: Summary
        run: |
          echo "### Portfolio Auto-Update $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "- Fetched all repos via GitHub API (auto)" >> $GITHUB_STEP_SUMMARY
          echo "- Updated src/data/projects.ts with latest stars/description/tech" >> $GITHUB_STEP_SUMMARY
          echo "- Generated favicons, OG image, resume PDF (auto)" >> $GITHUB_STEP_SUMMARY
          echo "- Ran type-check, lint, format, tests, build (gates)" >> $GITHUB_STEP_SUMMARY
          echo "- Pushed if changed — Vercel auto-deploys" >> $GITHUB_STEP_SUMMARY
          echo "- Completely automatic — no manual editing needed" >> $GITHUB_STEP_SUMMARY
